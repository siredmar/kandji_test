steps:
  - command: |
      # Ensure the repository is fully cloned
      git fetch --all --tags --prune
      # Checkout the branch or commit from BUILDKITE_BRANCH or BUILDKITE_COMMIT
      git checkout "${BUILDKITE_BRANCH}" || git checkout -b "${BUILDKITE_BRANCH}" "origin/${BUILDKITE_BRANCH}"
      git reset --hard "${BUILDKITE_COMMIT}"
    label: "Checkout Branch"
  - label: ":bash: Shellcheck"
    plugins:
      - shellcheck#v1.1.2:
          files:
            - "bin/*.sh"
  - wait
  - command:
      - "make ci_lint"
    label: ":golang: Lint"
  - command:
      - "make ci_test"
    label: ":golang: Test"
    agents:
      - "queue=default"
  - command:
      - "make ci_build"
    label: ":golang: Build"
    agents:
      - "queue=default"
    artifact_paths:
      - "bin/gxctl-*"
  - wait
  - label: ":docker: Build docker image"
    command:
      - 'buildkite-agent artifact download "bin/gxctl-*" . --step ":golang: Build"'
      - "make docker_all"
      - "make docker_push"
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    agents:
      - "queue=default"
  - wait
  - label: ":golang: Publish Release"
    command:
      - "make ci_semantic_release"
    branches: "master develop"
