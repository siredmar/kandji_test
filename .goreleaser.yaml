builds:
  - main: ./cmd/gxctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -w
      - -s
      - -X 'github.com/grid-x/gxctl/internal/version.GitCommit={{.FullCommit}}'
      - -X 'github.com/grid-x/gxctl/internal/version.BuildTime={{.Date}}'
      - -X 'github.com/grid-x/gxctl/internal/version.Version={{.Version}}'
archives:
  - name_template: >-
      {{- .ProjectName}}_
      {{- .Version}}_
      {{- if eq .Os "darwin" }}Mac
      {{- else }}{{- title .Os}}
      {{- end}}_
      {{- .Arch}}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: dist/CHANGELOG.md
        dst: .
        strip_parent: true
      - src: docs/README.md
        dst: .
        strip_parent: true
      - src: config/gridx/config.yaml
        dst: .
        strip_parent: true
  - id: eis
    name_template: >-
      {{- .ProjectName}}_eis_
      {{- .Version}}_
      {{- if eq .Os "darwin" }}Mac
      {{- else }}{{- title .Os}}
      {{- end}}_
      {{- .Arch}}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: dist/CHANGELOG.md
        dst: .
        strip_parent: true
      - src: docs/README.md
        dst: .
        strip_parent: true
      - src: config/eis/config.yaml
        dst: .
        strip_parent: true
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  groups:
  - title: Features
    regexp: "^.*feat[(\\w)/]*:+.*$"
    order: 0
  - title: 'Bug fixes'
    regexp: "^.*fix[(\\w)/]*:+.*$"
    order: 1
  - title: Others
    order: 999
  filters:
    exclude:
      - '^doc'
      - '^test'
      - '^chore'
      - '^Merge '
      - '^fix\(build\)'
