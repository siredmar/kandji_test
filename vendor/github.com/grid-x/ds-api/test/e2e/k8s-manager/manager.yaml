    control-plane: controller-manager
    controller-tools.k8s.io: "1.0"
  name: ds-k8s-controller-manager-service
  namespace: ds-k8s-system
spec:
  ports:
  - port: 443
  selector:
    control-plane: controller-manager
    controller-tools.k8s.io: "1.0"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    control-plane: controller-manager
    controller-tools.k8s.io: "1.0"
  name: ds-k8s-controller-manager
  namespace: ds-k8s-system
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      controller-tools.k8s.io: "1.0"
  serviceName: ds-k8s-controller-manager-service
  template:
    metadata:
      labels:
        control-plane: controller-manager
        controller-tools.k8s.io: "1.0"
    spec:
      containers:
      - args:
        - --k8s.sync-period=10h
        - --k8s.leader-election=false
        - --k8s.leader-election-ns=ds-k8s-system
        - --k8s.leader-election-config=ds-k8s-system-manager-leader
        command:
        - /root/manager
        image: 485611583707.dkr.ecr.eu-central-1.amazonaws.com/gridx/ds-k8s:master.96-55f04b2eaa1f1b7397c55863402cedbce76eb5e3
        imagePullPolicy: Never #NEDED WITH MINIKUBE
        name: manager
        resources:
          limits:
            cpu: 100m
            memory: 30Mi
          requests:
            cpu: 100m
            memory: 20Mi
      terminationGracePeriodSeconds: 10