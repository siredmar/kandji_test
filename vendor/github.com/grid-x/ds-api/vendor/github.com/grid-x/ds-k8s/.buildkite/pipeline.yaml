steps:
- command:
  - "make ci_test"
  label: ":llama: Tests"
  agents:
  - "queue=default"
- command:
  - "make ci_lint"
  label: ":llama: Linting"
  agents:
  - "queue=default"
- command:
  - "make ci_verify_codegen"
  label: ":llama: Verify generated code"
  agents:
  - "queue=default"
- wait
- command: "make ci_manager"
  label: ":golang: Build manager :k8s:"
  agents:
  - "queue=default"
  artifact_paths: "bin/*"
