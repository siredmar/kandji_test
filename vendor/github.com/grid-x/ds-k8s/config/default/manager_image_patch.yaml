apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      # Change the value of image field below to your controller image URL
      - image: IMAGE_URL
        name: manager
        args:
        - --k8s.sync-period=10h
        - --k8s.leader-election=false
        - --k8s.leader-election-ns=ds-k8s-system
        - --k8s.leader-election-config=ds-k8s-system-manager-leader
