steps:
- command:
  - "make ci_test"
  label: ":llama: Tests"
  agents:
  - "queue=default"
- command:
  - "make ci_lint"
  label: ":llama: Linting"
  agents:
  - "queue=default"
- command:
  - "make ci_verify_codegen"
  label: ":llama: Verify generated code"
  agents:
  - "queue=default"
- command: "make ci_manager"
  label: ":golang: Build manager :k8s:"
  agents:
  - "queue=default"
- wait
- command:
  - "make ci_docker"
  - ".buildkite/steps/aws_ecr_auth.sh"
  - "make ci_docker_push"
  - "make ci_docker_e2e"
  label: ":docker: Build docker image and do e2e tests with eks"
  agents:
  - "queue=default"
  branches: "master"
  concurrency: 1
  concurrency_group: ci_docker_e2e
- wait: ~
  continue_on_failure: true
- command:
  - "make ci_delete_eks_cluster"
  label: ":docker: Cleanup eks test env"
  agents:
  - "queue=default"
  branches: "master"
  concurrency: 1
  concurrency_group: ci_delete_eks_cluster